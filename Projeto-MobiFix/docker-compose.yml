services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64 
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}" # Lida do .env
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_PASSWORD}", "-Q", "SELECT 1", "-No"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── MobiFix.API + DAB ───
  api:
    build:
      context: ./MobiFix.API
      dockerfile: Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "5001:5001"
      - "5002:5002"
    volumes:
      - ./MobiFix.API/dab-config.json:/app/dab-config.json
      - ./Dataset/scripts/init.sql:/app/init.sql
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DB_PASSWORD: "${DB_PASSWORD}"
      DabSettings__BaseUrl: "http://localhost:5000"
      DAB_CONNECTION_STRING: "Server=sqlserver;Database=fixnride_db;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;"
      Jwt__Key: "${JWT_SECRET}" 
      Jwt__Issuer: "MobiFix.API"
      Jwt__Audience: "MobiFix.Frontend"

  frontend:
      image: node:22-alpine
      working_dir: /app
      ports:
        - "3000:3000" # Porta do servidor de desenvolvimento (Vite/React)
      volumes:
        - ./Frontend:/app
        - /app/node_modules # Importante: não apaga os módulos do container
      environment:
        - CHOKIDAR_USEPOLLING=true # Força o Hot Reload a funcionar no Windows
      command: sh -c "npm install && npm run dev" # Executa o modo desenvolvimento em vez do Nginx
      depends_on:
        - api

volumes:
  sqldata: